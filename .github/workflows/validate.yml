name: Validate site
on:
  pull_request:
  push:
    branches: [main, arena/01a0bfa3-shoulderpain]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build && git diff --exit-code -- '*.html' data/claims.json
      - run: npm run format:check && npm run check && npm test && npm run test:audit
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee browser-check.log
      - name: Surface browser failures in check annotations
        if: failure()
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          path = Path("browser-check.log")
          if path.exists():
              tail = "\n".join(line for line in path.read_text().splitlines() if "[WebServer]" not in line)[-3500:]
              escaped = tail.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print("::error title=Browser test details::" + escaped)
          PYTHON
