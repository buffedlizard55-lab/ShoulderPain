name: Validate site
on:
  pull_request:
  push:
    branches: [main, arena/01a0bcb6-shoulderpain]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build && git diff --exit-code -- '*.html' data/claims.json
      - run: npm run format:check && npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser and accessibility checks
        run: npm run test:browser
